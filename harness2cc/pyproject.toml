[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harness2cc"
version = "0.1.0"
description = "Harness² for the Claude Code harness: replay past decision points, probe harness edits in a sandbox, change nothing live without approval."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "harness2 @ git+https://github.com/google-research/harness2@1cfe254e8d25b15f37048c3730134686abe60335",
]

[project.scripts]
harness2cc = "harness2cc.cli:main"

[tool.setuptools]
package-dir = { "harness2cc" = "." }
packages = ["harness2cc"]
